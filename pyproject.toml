[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ffi"
version = "0.1.0"
description = "Forensic Filings Investigator: accounting-anomaly analysis reports for SEC registrants"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "rapidfuzz>=3.9",
    "selectolax>=1.0",
    "lxml>=5.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "networkx>=3.3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "ruptures>=1.1.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
]
pdf = ["xhtml2pdf>=0.2.16"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
anomaly-report = "ffi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ffi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "network: test needs live SEC EDGAR access (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
